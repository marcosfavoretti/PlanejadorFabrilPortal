<!-- <app-page-layout> -->
    <div class="d-flex flex-column h-100 p-2 gap-2">

        <div class="card border-0 shadow-sm flex-shrink-0 ponto-toolbox">
            <div class="card-body">
                <form [formGroup]="filterForm" (ngSubmit)="search()" class="ponto-toolbox-form">
                    <div class="ponto-toolbox-grid">
                        <div class="ponto-filter-field ponto-filter-field--centro">
                            <label for="ccid">Centro de custo</label>
                            <p-multiSelect
                                [options]="centroDeCusto"
                                optionLabel="setor"
                                inputId="ccid"
                                styleClass="ponto-control"
                                [class.centro-custo-selector--locked]="centroCustoSelectorDisabled()"
                                [attr.aria-disabled]="centroCustoSelectorDisabled()"
                                formControlName="ccid"
                                placeholder="Selecione os centros"
                                [showClear]="true"
                                [maxSelectedLabels]="2"
                                selectedItemsLabel="{0} centros selecionados"
                                display="chip"
                                appendTo="body"
                            >
                                <ng-template let-item pTemplate="item">
                                    {{ item.setor }} - {{ item.ccid }}
                                </ng-template>
                            </p-multiSelect>
                        </div>

                        <div class="ponto-filter-field">
                            <label for="indetificador">Identificador</label>
                            <div class="input-group ponto-control">
                                <span class="input-group-text">
                                    <i class="pi pi-user"></i>
                                </span>
                                <input
                                    type="text"
                                    id="indetificador"
                                    class="form-control"
                                    placeholder="Matrícula ou nome"
                                    formControlName="indetificador"
                                >
                            </div>
                        </div>

                        <div class="ponto-filter-field">
                            <label for="dataInicial">Data inicial</label>
                            <div class="input-group ponto-control">
                                <span class="input-group-text">
                                    <i class="pi pi-calendar"></i>
                                </span>
                                <input
                                    type="date"
                                    id="dataInicial"
                                    class="form-control"
                                    formControlName="dataInicio"
                                >
                            </div>
                        </div>

                        <div class="ponto-filter-field">
                            <label for="dataFinal">Data final</label>
                            <div class="input-group ponto-control">
                                <span class="input-group-text">
                                    <i class="pi pi-calendar-plus"></i>
                                </span>
                                <input
                                    type="date"
                                    id="dataFinal"
                                    class="form-control"
                                    formControlName="dataFim"
                                >
                            </div>
                        </div>

                        <div class="ponto-filter-actions">
                            <button type="submit" class="btn btn-success ponto-filter-submit">
                                <i class="pi pi-search"></i>
                                <span>Filtrar</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm grow">
            <div class="card-header bg-white border-0 pt-3 pb-2">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 class="text-success h5 m-0 fw-bold">
                        <i class="pi pi-list me-2"></i>Relatório de Ponto
                    </h2>
                    <span class="badge bg-light text-secondary border">Total: {{ totalItems() }}</span>
                </div>
            </div>
            <div id="pareto-canva">
                @if(fetching.pareto){
                <!-- <p-skeleton></p-skeleton> -->
                <p-skeleton height="150px" styleClass="mb-2"></p-skeleton>
                }
                @else {
                <app-horas-irregulares-pareto-chart [rawData]="chartHorasIrregulares()">
                </app-horas-irregulares-pareto-chart>
                }
            </div>
            <div class="card-body p-0 d-flex flex-column">

                <div class="grow relative-container">
                    <app-table-dynamic scrollHeight="flex" [tableModel]="tableModel" [data]="tableData()"
                        styleClass="h-100 w-100 position-absolute"></app-table-dynamic>
                </div>

                <div class="border-top bg-light p-2 shrink-0">
                    <p-paginator (onPageChange)="onPageChange($event)" [first]="currentPage() * itemsPerPage"
                        [rows]="itemsPerPage" [totalRecords]="totalItems()" [rowsPerPageOptions]="[10, 20, 50, 100]"
                        [showCurrentPageReport]="true" dropdownAppendTo="body"
                        currentPageReportTemplate="{first} - {last} de {totalRecords}"
                        styleClass="bg-transparent border-0 p-0 custom-paginator-compact">
                    </p-paginator>
                </div>
            </div>
        </div>

    </div>
<!-- </app-page-layout> -->
