<div class="ponto-dashboard-container fade-in">
  <div class="header-banner bg-dark-green mb-4">
    <div class="header-content">
      <div class="header-text">
        <h1 class="page-title">Presença e Faltas</h1>
        <p class="page-subtitle">Acompanhe quem está na fábrica e o absenteísmo da equipe</p>
      </div>
      <div class="header-icon-container">
        <i class="pi pi-users header-icon"></i>
      </div>
    </div>
  </div>

  <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" class="ponto-tabs">
    <p-tablist>
      <p-tab value="dados"><i class="pi pi-table me-2"></i>Dados</p-tab>
      <p-tab value="kpi"><i class="pi pi-chart-bar me-2"></i>KPI</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="dados">
        @if (filterContextReady()) {
        <section class="dashboard-section" aria-label="Presença dos funcionários">
          <div class="card-container">
            <form class="filters-panel" [formGroup]="presencaFilterForm" (ngSubmit)="applyPresencaFilters()">
              <div class="filters-grid">
                <div class="field">
                  <label for="presencaStatus"><i class="pi pi-flag mr-2"></i>Situação</label>
                  <p-select inputId="presencaStatus" formControlName="status" [options]="presencaStatusOptions"
                    optionLabel="label" optionValue="value" placeholder="Todas as situações" [showClear]="true"
                    appendTo="body" styleClass="w-full"></p-select>
                </div>
                <div class="field">
                  <label for="presencaData"><i class="pi pi-calendar mr-2"></i>Data</label>
                  <p-datepicker inputId="presencaData" formControlName="data" dateFormat="dd/mm/yy" [maxDate]="hoje"
                    [showIcon]="true" [showClear]="true" placeholder="Hoje" appendTo="body" styleClass="w-full"></p-datepicker>
                </div>
                <div class="field">
                  <label for="presencaCentroCusto"><i class="pi pi-building mr-2"></i>Centro de Custo</label>
                  <p-select inputId="presencaCentroCusto" formControlName="centroCustoCodigo" [options]="centroDeCusto"
                    optionLabel="setor" optionValue="ccid" [filter]="true" filterBy="setor,ccid"
                    placeholder="Centros permitidos" [showClear]="true" appendTo="body" styleClass="w-full"
                    [disabled]="centroCustoSelectorDisabled()" [class.centro-custo-selector--locked]="centroCustoSelectorDisabled()">
                    <ng-template let-centro pTemplate="item">{{ centro.ccid }} - {{ centro.setor }}</ng-template>
                    <ng-template let-centro pTemplate="selectedItem">{{ centro?.ccid }} - {{ centro?.setor }}</ng-template>
                  </p-select>
                </div>
                <div class="field">
                  <label for="presencaNome">Nome do funcionário</label>
                  <input pInputText id="presencaNome" formControlName="nome" placeholder="Parte do nome" />
                </div>
                <div class="field">
                  <label for="presencaMatricula">Matrícula do funcionário</label>
                  <input pInputText id="presencaMatricula" formControlName="matricula" placeholder="Matrícula exata" />
                </div>
                <div class="filter-actions">
                  <p-button type="submit" label="Aplicar" icon="pi pi-search" severity="success"></p-button>
                  <p-button label="Limpar" icon="pi pi-filter-slash" severity="secondary" [outlined]="true"
                    (click)="clearPresencaFilters()"></p-button>
                </div>
              </div>
            </form>

            <div class="table-panel table-dynamic-panel">
              <app-table-dynamic [tableModel]="presencaTableModel" [data]="presencas()" [exportable]="false" [lazy]="true"
                [loading]="fetching" [first]="presencaFirst" [rows]="presencaPageSize" [totalRecords]="presencaTotalItems()"
                [rowsPerPageOptions]="[10, 20, 50]" paginatorDropdownAppendTo="body" responsiveLayout="scroll"
                (lazyLoad)="onPresencaLazyLoad($event)"></app-table-dynamic>
            </div>
          </div>
        </section>
        }
      </p-tabpanel>
      <p-tabpanel value="kpi">
        @if (kpiAberto()) {
        <app-faltas-kpi></app-faltas-kpi>
        }
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
