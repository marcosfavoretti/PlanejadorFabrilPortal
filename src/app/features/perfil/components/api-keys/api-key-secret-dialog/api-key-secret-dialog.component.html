<p-dialog header="Copie sua API key agora" [visible]="!!apiKey()" [modal]="true" [closable]="true"
  [draggable]="false" [style]="{ width: 'min(40rem, 95vw)' }" (visibleChange)="onVisibleChange($event)">
  @if (apiKey(); as created) {
    <div class="api-key-secret">
      <div class="api-key-secret__warning">
        <i class="pi pi-exclamation-triangle"></i>
        <span>Esta é a única vez que a chave será exibida. Depois de fechar esta janela não será possível vê-la de novo.</span>
      </div>

      <div class="api-key-secret__field">
        <label for="api-key-secret">Chave de "{{ created.name }}"</label>
        <div class="api-key-secret__value">
          <input id="api-key-secret" pInputText readonly [value]="created.apiKey" (focus)="$any($event.target).select()"
            autocomplete="off" spellcheck="false" />
          <button type="button" pButton [icon]="copied() ? 'pi pi-check' : 'pi pi-copy'"
            [label]="copied() ? 'Copiada' : 'Copiar'" (click)="copy()"></button>
        </div>
      </div>
    </div>
  }

  <ng-template pTemplate="footer">
    <button type="button" pButton label="Já copiei, fechar" (click)="closed.emit()"></button>
  </ng-template>
</p-dialog>
